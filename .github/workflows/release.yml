# Builds FlowType.exe on a Windows machine and attaches FlowType-Windows.zip
# to the release. Runs when you publish a release on GitHub (Releases -> Draft
# a new release), or manually from the Actions tab.
name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build FlowType.exe
        run: |
          if (!(Test-Path flowtype.ico)) { python flowtype.py --make-icon }
          $ver = "${{ github.event.release.tag_name }}"
          if (-not $ver) { $ver = "0.0.0" }
          python scripts\windows\make_version_file.py $ver
          python -m PyInstaller --noconfirm --clean --windowed --name FlowType `
            --icon flowtype.ico --version-file version_info.txt `
            --collect-data faster_whisper `
            --collect-binaries ctranslate2 `
            --hidden-import pystray._win32 `
            flowtype.py

      - name: Self-test the packaged app
        run: |
          Start-Process -Wait -FilePath "dist\FlowType\FlowType.exe" -ArgumentList "--selftest", "$PWD\selftest.txt"
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern "SELFTEST OK" -Quiet)) { exit 1 }

      - name: Build the installer (FlowType-Setup.exe)
        run: |
          choco install innosetup -y --no-progress
          $ver = "${{ github.event.release.tag_name }}".TrimStart("v")
          if (-not $ver) { $ver = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" scripts\windows\FlowType-installer.iss
          Move-Item dist\FlowType-Setup.exe FlowType-Setup.exe

      - name: Zip (no-installer version)
        run: |
          Copy-Item SHARE-README.txt "dist\FlowType\HOW TO INSTALL.txt"
          Compress-Archive -Path dist\FlowType -DestinationPath FlowType-Windows.zip -Force

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlowType-Setup.exe
            FlowType-Windows.zip
          append_body: true
          body: |

            ---
            **Windows:** download **`FlowType-Setup.exe`** below and run it (normal installer, uninstall from Settings → Apps).
            No-install option: `FlowType-Windows.zip` → unzip → `FlowType.exe`.
            Windows may say "Windows protected your PC" → click **More info → Run anyway** (the app isn't code-signed yet).
            Code signing: free code signing provided by SignPath.io, certificate by SignPath Foundation (application in progress) - see the [code signing policy](https://github.com/soumyaswarrup/FlowType#code-signing-policy).

      - name: Keep the zip as a build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FlowType-Windows
          path: |
            FlowType-Setup.exe
            FlowType-Windows.zip
